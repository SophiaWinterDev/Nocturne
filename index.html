<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Nocturne</title>
        <link
            rel="shortcut icon"
            href="./assets/icon/logo.png"
            type="image/x-icon"
        />

        <script defer src="./JS/templates.js"></script>
        <script defer src="./script.js"></script>

        <link rel="stylesheet" href="./CSS/fonts.css" />
        <link rel="stylesheet" href="./CSS/variables.css" />
        <link rel="stylesheet" href="./style.css" />
        <link rel="stylesheet" href="./CSS/main.css" />
    </head>
    <body onload="init()" class="column center">
        <header class="column center full-width">
            <h1>Nocturne</h1>
            <span
                >───────── &nbsp;&nbsp;&nbsp;◇&nbsp;&nbsp;&nbsp; ─────────</span
            >
            <p>A LIBRARY OF DARK AND BEAUTIFUL STORIES</p>
        </header>
        <hr />
        <main class="column full-width">
            <section class="category-section column">
                <p id="bookAmount"></p>
                <div class="category-button-wrapper">
                    <button
                        id="categoryFavorites"
                        class="category-button"
                        onclick="chooseCategory(this, 'favorites')"
                    >
                        Favorites
                    </button>
                    <button
                        id="categoryAll"
                        class="category-button active-button"
                        onclick="chooseCategory(this, 'all')"
                    >
                        All Books
                    </button>
                    <button
                        id="categoryUrbanFantasy"
                        class="category-button"
                        onclick="chooseCategory(this, 'Urban Fantasy')"
                    >
                        Urban Fantasy
                    </button>
                    <button
                        id="categoryGothicFantasy"
                        class="category-button"
                        onclick="chooseCategory(this, 'Gothic Fantasy')"
                    >
                        Gothic Fantasy
                    </button>
                    <button
                        id="categoryDarkFantasy"
                        class="category-button"
                        onclick="chooseCategory(this, 'Dark Fantasy')"
                    >
                        Dark Fantasy
                    </button>
                    <button
                        id="categoryRomantasy"
                        class="category-button"
                        onclick="chooseCategory(this, 'Romantasy')"
                    >
                        Romantasy
                    </button>
                    <button
                        id="categoryDarkRomance"
                        class="category-button"
                        onclick="chooseCategory(this, 'Dark Romance')"
                    >
                        Dark Romance
                    </button>
                </div>
            </section>
            <section id="bookSection" class="book-section"></section>
        </main>
        <hr />
        <footer class="column center full-width">
            <img src="./assets/icon/logo.png" alt="Nocturne Logo" />
            <p>Nocturne</p>
        </footer>
    </body>
</html>
