<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Nocturne</title>
        <link
            rel="shortcut icon"
            href="./assets/icon/logo.png"
            type="image/x-icon"
        />

        <script defer src="./JS/books.js"></script>
        <script defer src="./JS/templates.js"></script>
        <script defer src="./script.js"></script>

        <link rel="stylesheet" href="./CSS/fonts.css" />
        <link rel="stylesheet" href="./CSS/variables.css" />
        <link rel="stylesheet" href="./style.css" />
        <link rel="stylesheet" href="./CSS/main.css" />
    </head>
    <body onload="init()" class="column center">
        <header class="column center full-width header">
            <h1>Nocturne</h1>
            <div aria-hidden="true">
                ───────── &nbsp;&nbsp;&nbsp;◇&nbsp;&nbsp;&nbsp; ─────────
            </div>
            <p>A LIBRARY OF DARK AND BEAUTIFUL STORIES</p>
        </header>
        <hr />
        <main class="column full-width main">
            <section class="category-section column">
                <p id="bookAmount"></p>
                <div class="category-button-wrapper">
                    <button
                        id="categoryFavorites"
                        class="category-button"
                        onclick="chooseCategory(this, 'favorites')"
                    >
                        Favorites
                    </button>
                    <button
                        id="categoryAll"
                        class="category-button active-button"
                        onclick="chooseCategory(this, 'all')"
                    >
                        All Books
                    </button>
                    <button
                        id="categoryUrbanFantasy"
                        class="category-button"
                        onclick="chooseCategory(this, 'Urban Fantasy')"
                    >
                        Urban Fantasy
                    </button>
                    <button
                        id="categoryGothicFantasy"
                        class="category-button"
                        onclick="chooseCategory(this, 'Gothic Fantasy')"
                    >
                        Gothic Fantasy
                    </button>
                    <button
                        id="categoryDarkFantasy"
                        class="category-button"
                        onclick="chooseCategory(this, 'Dark Fantasy')"
                    >
                        Dark Fantasy
                    </button>
                    <button
                        id="categoryRomantasy"
                        class="category-button"
                        onclick="chooseCategory(this, 'Romantasy')"
                    >
                        Romantasy
                    </button>
                    <button
                        id="categoryDarkRomance"
                        class="category-button"
                        onclick="chooseCategory(this, 'Dark Romance')"
                    >
                        Dark Romance
                    </button>
                </div>
            </section>
            <ul id="bookSection" class="book-section"></ul>
            <dialog id="dialog">
                <header>
                    <h3>Add a new book:</h3>
                </header>
                <form id="form" class="column" onsubmit="addNewBook(event)">
                    <main class="column">
                        <label for="genreSelection">Choose a genre:</label>
                        <select
                            name="genreSelection"
                            id="genreSelection"
                            class="highlight-border"
                            required
                        >
                            <option value="" disabled selected></option>
                            <option value="Urban Fantasy">Urban Fantasy</option>
                            <option value="Gothic Fantasy">
                                Gothic Fantasy
                            </option>
                            <option value="Dark Fantasy">Dark Fantasy</option>
                            <option value="Romantasy">Romantasy</option>
                            <option value="Dark Romance">Dark Romance</option>
                        </select>
                        <label for="titleInput">Booktitle:</label>
                        <input
                            type="text"
                            id="titleInput"
                            name="titleInput"
                            class="highlight-border"
                            required
                        />
                        <label for="authorInput">Name of the author:</label>
                        <input
                            type="text"
                            id="authorInput"
                            name="authorInput"
                            class="highlight-border"
                            required
                        />
                        <label for="yearInput">Year of publication:</label>
                        <input
                            type="text"
                            id="yearInput"
                            name="yearInput"
                            class="highlight-border"
                            required
                        />
                        <label for="priceInput">Price:</label>
                        <input
                            type="number"
                            id="priceInput"
                            name="priceInput"
                            step="0.01"
                            min="0"
                            class="highlight-border"
                            required
                        />
                    </main>
                    <footer>
                        <button type="button" onclick="closeDialog()">
                            Cancel
                        </button>
                        <button type="submit">Add book</button>
                    </footer>
                </form>
            </dialog>
        </main>
        <hr />
        <footer class="column center full-width footer">
            <img src="./assets/icon/logo.png" alt="Nocturne Logo" />
            <p>Nocturne</p>
        </footer>
    </body>
</html>
